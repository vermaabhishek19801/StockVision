version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockvision-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - redis
    networks:
      - stockvision-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockvision-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - stockvision-net

  mongodb:
    image: mongo:7
    container_name: stockvision-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: stockvision
    networks:
      - stockvision-net

  redis:
    image: redis:7-alpine
    container_name: stockvision-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - stockvision-net

volumes:
  mongo-data:
  redis-data:

networks:
  stockvision-net:
    driver: bridge
